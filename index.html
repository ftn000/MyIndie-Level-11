<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Огонёк</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Огонёк: жизнь = размер = свет = топливо. Один файл, без зависимостей.
const T = 32, W = 136, H = 17, VW = 960, VH = 544;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH;
const lc = document.createElement('canvas'); lc.width = VW; lc.height = VH;
const lx = lc.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- состояние ----------
let grid, lit, burning, melt, bridge, spawners, drops, parts, decos, tail;
let p, cp, cam = 0, time = 0, deaths = 0, playT = 0, scene = 'title', winT = 0, hissBoost = 0;
const FAN_X = 89 * T + 16;
const keys = new Set();
let jumpP = false, dashP = false;

const HINTS = [
  [3, 'Стрелки / A D — идти, Пробел — прыжок'], [19, 'Shift — вспышка (−15% пламени)'],
  [29, 'Капли и лужи гасят пламя'], [51, 'Большое пламя плавит лёд'],
  [58, 'Зажми ↓ — стань фитильком'], [70, 'Сквозняк тушит. Прячься за камни'],
  [92, 'Держи прыжок в тёплом потоке'], [113, 'Верёвки горят. Одна из них — не простая']
];

function build() {
  grid = Array.from({ length: H }, () => Array(W).fill('.'));
  const box = (a, b, c, d, ch) => { for (let y = b; y <= d; y++) for (let x = a; x <= c; x++) grid[y][x] = ch; };
  box(0, 0, W - 1, 0, '#'); box(0, 16, W - 1, 16, '#'); box(0, 0, 0, 16, '#'); box(W - 1, 0, W - 1, 16, '#');
  // 1: старт
  box(8, 14, 9, 15, '#'); box(12, 12, 13, 15, '#'); grid[11][12] = 'p'; grid[15][19] = 'p';
  // 2: капли и лужи
  spawners = [];
  [[31, 0], [36, 0.7], [41, 1.4]].forEach(([x, off]) => { grid[1][x] = 'd'; spawners.push({ x, ph: off }); });
  [33, 34, 38, 39, 44, 45, 46].forEach(x => grid[15][x] = '~');
  grid[15][41] = 'p';
  // 3: лёд и вентиляция
  box(54, 1, 54, 15, 'I');
  box(62, 1, 62, 14, '#'); grid[15][62] = 'v';
  // 4: сквозняк
  box(74, 14, 75, 15, '#'); box(79, 14, 80, 15, '#'); box(84, 14, 85, 15, '#'); grid[1][89] = 'F';
  // 5: пропасть и тёплые потоки
  for (let x = 93; x <= 110; x++) grid[16][x] = '.';
  [94, 95, 96, 101, 102, 103].forEach(x => { for (let y = 1; y <= 16; y++) grid[y][x] = 'U'; });
  box(98, 12, 99, 12, '#'); box(106, 11, 107, 11, '#'); box(109, 14, 110, 14, '#');
  // 6: верёвки, мост, камин
  box(115, 1, 115, 15, 'R'); box(120, 6, 120, 13, 'T');
  for (let x = 122; x <= 127; x++) grid[16][x] = 'b';
  grid[15][132] = 'G';
  [[3, 15], [26, 15], [50, 15], [58, 15], [66, 15], [91, 15], [113, 15], [117, 15]].forEach(([x, y]) => grid[y][x] = 'c');
  lit = new Set(['3,15']); burning = new Map(); melt = {}; bridge = false;
  drops = []; parts = []; tail = Array.from({ length: 8 }, () => ({ x: 0, y: 0 }));
  // декор фона: цвет оживает рядом с огнём
  decos = []; let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#6b3f2a', '#3f6b52', '#7a5a2a', '#4a3f7a', '#7a3a4a'];
  for (let x = 90; x < W * T - 90; x += 70 + r() * 110) {
    const k = r(), c = cols[Math.floor(r() * cols.length)];
    if (k < 0.45) { const h = 90 + r() * 70; decos.push({ x, y: 512 - h, w: 56 + r() * 30, h, c, t: 0 }); }
    else if (k < 0.8) decos.push({ x, y: 120 + r() * 120, w: 34, h: 44, c, t: 1 });
    else decos.push({ x, y: 490, w: 14, h: 22, c, t: 2 });
  }
  cp = { x: 3, y: 15 };
  p = { x: 0, y: 0, vx: 0, vy: 0, s: 0.8, h: 12, face: 1, dashT: 0, dashCd: 0, onG: false, coy: 0, buf: 0, dead: false, deadT: 0 };
  respawn(0.8); playT = 0;
}

function respawn(s) {
  p.s = s; p.h = (10 + 16 * s) / 2; p.x = cp.x * T + 16; p.y = (cp.y + 1) * T - p.h - 1;
  p.vx = p.vy = 0; p.dead = false; p.dashT = 0; cam = Math.max(0, Math.min(W * T - VW, p.x - VW / 2));
}

// ---------- мир ----------
const tileAt = (x, y) => (grid[Math.floor(y / T)] || [])[Math.floor(x / T)];
function solid(tx, ty) {
  if (tx < 0 || tx >= W || ty < 0) return true;
  if (ty >= H) return false;
  const c = grid[ty][tx];
  return c === '#' || c === 'I' || c === 'R' || (c === 'v' && p.s >= 0.3) || (c === 'b' && bridge);
}
function hits() {
  const h = p.h;
  for (let ty = Math.floor((p.y - h) / T); ty <= Math.floor((p.y + h) / T); ty++)
    for (let tx = Math.floor((p.x - h) / T); tx <= Math.floor((p.x + h) / T); tx++)
      if (solid(tx, ty)) return true;
  return false;
}
const gustPh = () => time % 4.6;
const warning = () => gustPh() > 1.9 && gustPh() <= 2.9;
const gusting = () => gustPh() > 2.9 && gustPh() < 4.5;
function exposed() {
  if (p.x > FAN_X || p.x < FAN_X - 22 * T) return false;
  for (let x = p.x + p.h; x < FAN_X; x += 8) if (solid(Math.floor(x / T), Math.floor(p.y / T))) return false;
  return true;
}

function spark(x, y, n, spd, kind) {
  for (let i = 0; i < n && parts.length < 500; i++) {
    if (kind === 'w') parts.push({ t: 'w', x: x + rnd(-6, 6), y, vx: rnd(-15, 15), vy: rnd(-50, -20), life: rnd(.6, 1.1), max: 1.1, r: rnd(3, 6) });
    else parts.push({ t: 's', x, y, vx: rnd(-spd, spd), vy: -rnd(spd * .2, spd), life: rnd(.8, 1.8), max: 1.8, r: rnd(1, 2.2) });
  }
}
function ignite(x, y) {
  const k = y * W + x;
  if (burning.has(k)) return;
  burning.set(k, { x, y, t: 0, ch: grid[y][x], sp: 0 });
  hissBoost = Math.max(hissBoost, .1);
}
function die() {
  p.dead = true; p.deadT = 0; deaths++; spark(p.x, p.y, 8, 60, 'w');
  tone(180, .8, 'sawtooth', .08, 40); hissBoost = .5;
}

function update(dt) {
  time += dt; playT += dt;
  if (p.dead) { p.deadT += dt; if (p.deadT > 1.2) respawn(0.7); updateParts(dt); return; }
  p.h = (10 + 16 * p.s) / 2;
  const held = keys.has('Space') || keys.has('ArrowUp') || keys.has('KeyW');
  const dir = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  const down = keys.has('ArrowDown') || keys.has('KeyS');
  if (dir) p.face = dir;
  p.dashCd -= dt;
  if (dashP && p.dashCd <= 0 && p.s > 0.16) {
    p.s -= 0.15; p.dashT = 0.18; p.dashCd = 0.5; spark(p.x, p.y, 16, 220); tone(500, .25, 'sawtooth', .05, 120); hissBoost = .15;
  }
  dashP = false;

  // топливо
  let drain = 0.012 + 0.04 * p.s, gain = 0;
  for (const k of lit) { const [cx, cy] = k.split(',').map(Number); if (Math.hypot(p.x - (cx * T + 16), p.y - (cy * T + 16)) < 52) gain = 0.25; }
  const wind = gusting() && exposed() ? -200 : 0;
  if (wind) drain += 0.25;
  p.s += gain ? gain * dt : -drain * dt;
  if (down && p.s > 0.12) p.s = Math.max(0.12, p.s - 0.5 * dt);
  p.s = Math.min(1, p.s);

  // движение
  p.buf -= dt; p.coy -= dt;
  if (jumpP) p.buf = 0.12; jumpP = false;
  if (p.onG) p.coy = 0.1;
  const inU = tileAt(p.x, p.y) === 'U';
  if (p.dashT > 0) { p.dashT -= dt; p.vx = p.face * 520; p.vy = 0; }
  else {
    p.vx += (dir * 190 - p.vx) * Math.min(1, (p.onG ? 18 : 9) * dt);
    p.vy = Math.min(p.vy + 1000 * dt, 520);
    if (inU && held) p.vy = Math.max(p.vy - 3200 * dt, -170);
    if (p.buf > 0 && p.coy > 0) { p.vy = -(350 + 130 * p.s); p.buf = p.coy = 0; tone(300, .12, 'sine', .04, 600); }
    if (!held && p.vy < -140 && !inU) p.vy += 2200 * dt;
  }
  const sx = p.vx + wind;
  p.x += sx * dt;
  if (hits()) {
    p.x = sx > 0 ? Math.floor((p.x + p.h) / T) * T - p.h - 0.001 : (Math.floor((p.x - p.h) / T) + 1) * T + p.h + 0.001;
    p.vx = 0;
  }
  p.y += p.vy * dt; p.onG = false;
  if (hits()) {
    if (p.vy > 0) { p.y = Math.floor((p.y + p.h) / T) * T - p.h - 0.001; p.onG = true; }
    else p.y = (Math.floor((p.y - p.h) / T) + 1) * T + p.h + 0.001;
    p.vy = 0;
  }

  interact(dt);
  for (let i = 0; i < 10 && hits(); i++) p.y -= 1; // вырос в стене после подпитки

  // хвост и искры
  tail[0].x = p.x; tail[0].y = p.y;
  for (let i = 1; i < tail.length; i++) {
    tail[i].x += (tail[i - 1].x - tail[i].x) * Math.min(1, 9 * dt);
    tail[i].y += (tail[i - 1].y - 5 - tail[i].y) * Math.min(1, 9 * dt);
  }
  if (Math.random() < 0.6) parts.push({ t: 's', x: p.x + rnd(-p.h, p.h), y: p.y, vx: rnd(-30, 30) - p.vx * .1, vy: -rnd(10, 60), life: rnd(.9, 1.6), max: 1.6, r: rnd(1, 2) });

  // ветер и потоки: визуальные частицы
  if ((warning() || gusting()) && cam + VW > 69 * T && cam < 90 * T)
    parts.push({ t: 'k', x: Math.min(FAN_X, cam + VW + 40), y: rnd(11, 15.8) * T, vx: -(gusting() ? 700 : 250), vy: 0, life: .9, max: .9, r: 0 });
  if (cam + VW > 94 * T && cam < 105 * T && Math.random() < .5)
    parts.push({ t: 'u', x: ([94, 95, 96, 101, 102, 103][Math.floor(Math.random() * 6)] + Math.random()) * T, y: 16 * T, vx: 0, vy: -rnd(90, 160), life: 1.6, max: 1.6, r: 0 });

  // капли
  for (const s of spawners) {
    s.ph += dt;
    if (s.ph >= 2.2) { s.ph -= 2.2; drops.push({ x: s.x * T + 16, y: T + 24, vy: 0 }); }
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.vy += 800 * dt; d.y += d.vy * dt;
    if (Math.abs(d.x - p.x) < p.h + 3 && Math.abs(d.y - p.y) < p.h + 5) {
      p.s -= 0.18; spark(d.x, d.y, 6, 0, 'w'); tone(1800, .2, 'sawtooth', .04, 300); hissBoost = .3; drops.splice(i, 1);
    } else if (solid(Math.floor(d.x / T), Math.floor(d.y / T))) {
      if (Math.abs(d.x - p.x) < 500) tone(1100, .1, 'sine', .05, 500);
      drops.splice(i, 1);
    }
  }
  updateParts(dt);

  const tx = p.x - VW / 2 + p.face * 60;
  cam = Math.max(0, Math.min(W * T - VW, cam + (tx - cam) * Math.min(1, 5 * dt)));
  if (p.s <= 0 || p.y > H * T + 40) die();
}

function interact(dt) {
  const tx0 = Math.floor(p.x / T), ty0 = Math.floor(p.y / T);
  for (let ty = Math.max(0, ty0 - 3); ty <= Math.min(H - 1, ty0 + 3); ty++)
    for (let tx = Math.max(0, tx0 - 3); tx <= Math.min(W - 1, tx0 + 3); tx++) {
      const c = grid[ty][tx], cx = tx * T + 16, cy = ty * T + 16;
      const eu = Math.hypot(p.x - cx, p.y - cy), ch = Math.max(Math.abs(p.x - cx), Math.abs(p.y - cy));
      if (c === 'p' && eu < 24) { grid[ty][tx] = '.'; p.s = Math.min(1, p.s + 0.3); spark(cx, cy, 14, 120); tone(700, .25, 'triangle', .06, 1400); }
      else if (c === 'c' && eu < 30 && !lit.has(tx + ',' + ty)) {
        lit.add(tx + ',' + ty); cp = { x: tx, y: ty }; p.s = Math.min(1, p.s + 0.5); spark(cx, cy - 8, 24, 140);
        tone(520, .5, 'triangle', .07, 1040); setTimeout(() => tone(780, .6, 'triangle', .06, 1560), 120);
      }
      else if (c === 'I' && ch < p.h + T / 2 + 10 && (p.s >= 0.5 || p.dashT > 0)) {
        const k = ty * W + tx; melt[k] = (melt[k] || 0) + dt;
        if (Math.random() < .3) spark(cx, cy, 1, 0, 'w');
        if (melt[k] > 0.6) { grid[ty][tx] = '.'; p.s -= 0.03; spark(cx, cy, 5, 0, 'w'); hissBoost = .2; }
      }
      else if ((c === 'R' || c === 'T') && ch < p.h + T / 2 + 8 && p.s > 0.12) ignite(tx, ty);
      else if (c === '~' && Math.abs(p.x - cx) < p.h + 16 && p.y + p.h > (ty + 1) * T - 11 && p.y - p.h < (ty + 1) * T) {
        p.s -= 0.6 * dt; if (Math.random() < .5) spark(p.x, p.y + p.h, 1, 0, 'w'); hissBoost = Math.max(hissBoost, .25);
      }
      else if (c === 'G' && eu < 60) { scene = 'win'; winT = 0; tone(392, 1.5, 'triangle', .08, 392); tone(523, 1.8, 'triangle', .07, 523); tone(659, 2.2, 'triangle', .06, 659); }
    }
  for (const [k, b] of burning) {
    b.t += dt;
    if (Math.random() < .5) spark(b.x * T + 16, b.y * T + 16, 1, 40);
    if (!b.sp && b.t > 0.18) {
      b.sp = 1;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        const nx = b.x + dx, ny = b.y + dy;
        if (grid[ny] && 'RT'.includes(grid[ny][nx]) && !burning.has(ny * W + nx)) ignite(nx, ny);
      }
    }
    if (b.t > 0.6) {
      grid[b.y][b.x] = '.'; burning.delete(k);
      if (b.ch === 'T' && !bridge) { bridge = true; spark(125 * T, 16 * T, 30, 80, 'w'); tone(90, .9, 'sawtooth', .1, 40); }
    }
  }
}

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.t === 's') {
      if (!q.rest) {
        q.vy += 500 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
        if (q.vy > 0 && solid(Math.floor(q.x / T), Math.floor(q.y / T))) { q.vx = q.vy = 0; q.rest = true; q.life = Math.min(q.life, .6); }
      }
    } else { q.x += q.vx * dt; q.y += q.vy * dt; if (q.t === 'w') q.r += 6 * dt; }
    if (q.life <= 0) parts.splice(i, 1);
  }
}

// ---------- звук ----------
let ac, snd;
function initAudio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const n = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const loop = (type, f, q) => {
    const s = ac.createBufferSource(); s.buffer = n; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(); return g.gain;
  };
  snd = { crackle: loop('bandpass', 2200, .8), hiss: loop('highpass', 6000, .5), wind: loop('lowpass', 600, 1) };
  const pad = ac.createGain(); pad.gain.value = 0; pad.connect(ac.destination); snd.pad = pad.gain;
  [110, 164.8, 220.5].forEach(f => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(pad); o.start(); });
}
function tone(f, d, type, v, f2) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}
function updateAudio() {
  if (!ac || !snd) return;
  const t = ac.currentTime, s = scene === 'play' && !p.dead ? p.s : 0;
  snd.crackle.setTargetAtTime((0.01 + 0.04 * s) * (Math.random() < .2 ? 3.5 : .6), t, .02);
  snd.hiss.setTargetAtTime((s < .3 ? (.3 - s) * .12 : 0) + hissBoost * .15, t, .05);
  snd.wind.setTargetAtTime(gusting() ? .25 : warning() ? .06 : 0, t, .2);
  snd.pad.setTargetAtTime(s < .25 ? .004 : .02, t, .5);
  hissBoost *= 0.92;
}

// ---------- отрисовка ----------
function lights() {
  const L = [];
  if (scene === 'play' && !p.dead) L.push([p.x, p.y, 50 + 270 * p.s, 1]);
  else if (p.dead) L.push([p.x, p.y, 40 * Math.max(0, 1 - p.deadT), 1]);
  for (const k of lit) { const [x, y] = k.split(',').map(Number); L.push([x * T + 16, y * T + 8, 110 + Math.sin(time * 9 + x) * 6, .8]); }
  for (const b of burning.values()) L.push([b.x * T + 16, b.y * T + 16, 80, .8]);
  L.push([132 * T + 16, 15 * T, scene === 'win' ? 260 + winT * 500 : 230, 1]);
  return L;
}

function drawFlame(x, y, r, pts) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = pts.length - 1; i >= 0; i--) {
    const q = pts[i], rr = r * (1 - i * 0.1) * (0.9 + 0.1 * Math.sin(time * 18 + i));
    const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, rr);
    g.addColorStop(0, 'rgba(255,240,180,.9)'); g.addColorStop(.45, 'rgba(255,150,40,.7)'); g.addColorStop(1, 'rgba(200,40,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, rr, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,230,.85)'; ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y + 1, r * .3, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

function render() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#10131d'); g.addColorStop(1, '#1c2030'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.translate(-Math.round(cam), 0);
  const x0 = Math.floor(cam / T), x1 = Math.min(W - 1, x0 + VW / T + 1);

  for (const d of decos) {
    if (d.x + d.w < cam || d.x > cam + VW) continue;
    ctx.fillStyle = d.c; ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    if (d.t === 0) for (let y = d.y + 20; y < d.y + d.h; y += 24) ctx.fillRect(d.x + 4, y, d.w - 8, 3);
    if (d.t === 1) ctx.fillRect(d.x + 5, d.y + 5, d.w - 10, d.h - 10);
  }

  ctx.font = 'italic 15px Georgia,serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,215,160,.9)';
  for (const [x, t] of HINTS) ctx.fillText(t, x * T + 16, 360);

  // fireplace
  ctx.fillStyle = '#4a4038'; ctx.fillRect(130 * T, 12 * T, 4 * T, 4 * T);
  ctx.fillStyle = '#140b08'; ctx.fillRect(131 * T, 13 * T + 8, 2 * T, 3 * T - 8);
  ctx.fillStyle = '#5a3b22'; ctx.fillRect(131 * T + 6, 16 * T - 12, 2 * T - 12, 10);

  for (let ty = 0; ty < H; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = grid[ty][tx], X = tx * T, Y = ty * T;
    if (c === '#') {
      ctx.fillStyle = '#2c3145'; ctx.fillRect(X, Y, T, T);
      ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(X + ((tx * 7 + ty * 13) % 5) * 5, Y, 2, T);
      if (ty === 0 || grid[ty - 1][tx] !== '#') { ctx.fillStyle = '#4d5578'; ctx.fillRect(X, Y, T, 3); }
    } else if (c === 'I') {
      ctx.fillStyle = 'rgba(130,190,225,.85)'; ctx.fillRect(X, Y, T, T);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(X + 4, Y, 3, T);
    } else if (c === 'R') {
      ctx.fillStyle = '#7a4a3a'; ctx.fillRect(X + 4, Y, T - 8, T);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let i = 8; i < T - 6; i += 6) ctx.fillRect(X + i, Y, 2, T);
    } else if (c === 'T') {
      ctx.fillStyle = '#c4a46a'; ctx.fillRect(X + 13, Y, 6, T);
      ctx.fillStyle = 'rgba(0,0,0,.3)'; for (let i = 0; i < T; i += 6) ctx.fillRect(X + 13, Y + i, 6, 2);
    } else if (c === 'v') {
      ctx.fillStyle = '#1a1c26'; ctx.fillRect(X, Y, T, T);
      ctx.fillStyle = '#5a6076'; for (let i = 4; i < T; i += 8) ctx.fillRect(X, Y + i, T, 2);
    } else if (c === 'b' && bridge) {
      ctx.fillStyle = '#8a6a44'; ctx.fillRect(X, Y, T, T); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(X + T - 2, Y, 2, T);
    } else if (c === 'c') {
      ctx.fillStyle = '#e9e2cf'; ctx.fillRect(X + 11, Y + 16, 10, 16); ctx.fillStyle = '#222'; ctx.fillRect(X + 15, Y + 10, 2, 6);
    } else if (c === 'p') {
      ctx.save(); ctx.translate(X + 16, Y + 22); ctx.rotate(-.2); ctx.fillStyle = '#d8cfae'; ctx.fillRect(-9, -11, 18, 22);
      ctx.fillStyle = 'rgba(0,0,0,.3)'; for (let i = -6; i < 8; i += 5) ctx.fillRect(-6, i, 12, 1); ctx.restore();
    } else if (c === '~') {
      ctx.fillStyle = 'rgba(70,130,200,.65)'; ctx.fillRect(X, Y + T - 10, T, 10);
      ctx.fillStyle = 'rgba(200,230,255,.4)'; ctx.fillRect(X + 6 + Math.sin(time * 3 + tx) * 4, Y + T - 9, 8, 1);
    } else if (c === 'd') {
      ctx.fillStyle = '#3b4258'; ctx.fillRect(X + 10, Y, 12, 12);
      const s = spawners.find(s => s.x === tx);
      if (s && s.ph > 1.8) { ctx.fillStyle = '#6fb0e8'; ctx.beginPath(); ctx.arc(X + 16, Y + 14 + (s.ph - 1.8) * 10, 3 + (s.ph - 1.8) * 3, 0, 7); ctx.fill(); }
    } else if (c === 'F') {
      ctx.save(); ctx.translate(X + 16, Y + 18); ctx.fillStyle = '#5a6076'; ctx.fillRect(-4, -18, 8, 10);
      ctx.rotate(time * (gusting() ? 20 : warning() ? 8 : 1)); ctx.fillRect(-14, -2, 28, 4); ctx.fillRect(-2, -14, 4, 28); ctx.restore();
    }
  }

  for (const d of drops) { ctx.fillStyle = '#6fb0e8'; ctx.beginPath(); ctx.ellipse(d.x, d.y, 3, 5, 0, 0, 7); ctx.fill(); }
  for (const q of parts) {
    const a = Math.max(0, q.life / q.max);
    if (q.t === 's') { ctx.fillStyle = `rgba(255,${180 + a * 60 | 0},80,${a})`; ctx.fillRect(q.x, q.y, q.r, q.r); }
    else if (q.t === 'w') { ctx.fillStyle = `rgba(210,215,225,${a * .35})`; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
    else if (q.t === 'k') { ctx.fillStyle = `rgba(200,220,255,${a * .4})`; ctx.fillRect(q.x, q.y, 36, 1.5); }
    else { ctx.fillStyle = `rgba(255,190,90,${a * .5})`; ctx.fillRect(q.x, q.y, 2, 2); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const k of lit) { // огоньки свечей
    const [x, y] = k.split(',').map(Number), fx = x * T + 16, fy = y * T + 6, r = 7 + Math.sin(time * 14 + x) * 1.5;
    ctx.fillStyle = 'rgba(255,170,60,.9)'; ctx.beginPath(); ctx.ellipse(fx, fy, r * .5, r, 0, 0, 7); ctx.fill();
  }
  for (const b of burning.values()) {
    ctx.fillStyle = 'rgba(255,140,40,.7)'; ctx.beginPath(); ctx.arc(b.x * T + 16, b.y * T + 14, 12 + Math.random() * 4, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const fl = [{ x: 132 * T + 16, y: 15 * T - 8 }, { x: 132 * T + 16, y: 15 * T - 18 }, { x: 132 * T + 16, y: 15 * T - 28 }];
  drawFlame(0, 0, 34 + (scene === 'win' ? winT * 10 : 0), fl.map(f => ({ x: f.x + Math.sin(time * 5 + f.y) * 3, y: f.y })));
  if (!p.dead && scene !== 'title') drawFlame(p.x, p.y, (p.h + 6) * 1.6, tail);
  ctx.restore();

  // тепло света + тьма
  const L = lights();
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, a] of L) {
    const sx = x - cam, gr = ctx.createRadialGradient(sx, y, 0, sx, y, r);
    gr.addColorStop(0, `rgba(255,140,40,${.22 * a})`); gr.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = gr; ctx.fillRect(sx - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  lx.globalCompositeOperation = 'source-over'; lx.clearRect(0, 0, VW, VH);
  lx.fillStyle = 'rgba(3,4,8,.96)'; lx.fillRect(0, 0, VW, VH);
  lx.globalCompositeOperation = 'destination-out';
  for (const [x, y, r] of L) {
    if (r <= 0) continue;
    const fr = r * (1 + Math.sin(time * 13) * .03), sx = x - cam, gr = lx.createRadialGradient(sx, y, fr * .1, sx, y, fr);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.6, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = gr; lx.fillRect(sx - fr, y - fr, fr * 2, fr * 2);
  }
  ctx.drawImage(lc, 0, 0);
  overlay();
}

function overlay() {
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,210,150,.95)';
  if (scene === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#ffcf8a'; ctx.font = 'italic 72px Georgia,serif'; ctx.fillText('Огонёк', VW / 2, 220);
    ctx.font = 'italic 20px Georgia,serif'; ctx.fillStyle = 'rgba(255,210,150,.85)';
    ctx.fillText('Последняя спичка. Холодный дом. Доберись до камина, пока не погас свет.', VW / 2, 270);
    ctx.fillText(Math.sin(time * 3) > -.3 ? 'Нажми Пробел' : '', VW / 2, 340);
  } else if (scene === 'win') {
    ctx.font = 'italic 56px Georgia,serif'; ctx.fillStyle = `rgba(60,25,5,${Math.min(1, winT / 2)})`;
    ctx.fillText('Ты дома', VW / 2, 190);
    ctx.font = 'italic 22px Georgia,serif';
    ctx.fillText(`Время ${playT.toFixed(1)} с · погасал ${deaths} раз(а) · Enter — заново`, VW / 2, 235);
  } else if (p.dead) {
    ctx.font = 'italic 36px Georgia,serif'; ctx.fillStyle = `rgba(255,210,150,${Math.min(1, p.deadT)})`; ctx.fillText('Погас…', VW / 2, VH / 2);
  } else if (playT < 9) {
    ctx.font = 'italic 16px Georgia,serif'; ctx.fillStyle = `rgba(255,210,150,${Math.min(1, 9 - playT)})`;
    ctx.fillText('Пламя — это и жизнь, и свет. Грейся у свечей.', VW / 2, 40);
  }
}

// ---------- ввод и цикл ----------
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (scene === 'title' && (e.code === 'Space' || e.code === 'Enter')) { initAudio(); scene = 'play'; playT = 0; time = 0; return; }
  if (scene === 'win' && (e.code === 'Enter' || e.code === 'KeyR')) { deaths = 0; build(); scene = 'play'; return; }
  if (e.code === 'KeyR' && scene === 'play') { deaths = 0; build(); }
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpP = true;
  if (['ShiftLeft', 'ShiftRight', 'KeyX', 'KeyK'].includes(e.code)) dashP = true;
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

let last = 0;
function frame(ts) {
  const dt = Math.min(.033, (ts - last) / 1000 || 0); last = ts;
  if (scene === 'play') update(dt);
  else { time += dt; if (scene === 'win') { winT += dt; updateParts(dt); if (Math.random() < .5) spark(132 * T + 16, 15 * T - 20, 1, 140); } }
  updateAudio(); render(); requestAnimationFrame(frame);
}
build();
window.game = { step: update, get p() { return p; }, get scene() { return scene; }, get bridge() { return bridge; }, grid: () => grid, setCp: (x, y) => { cp = { x, y }; respawn(1); } };
requestAnimationFrame(frame);
</script>
</body>
</html>
