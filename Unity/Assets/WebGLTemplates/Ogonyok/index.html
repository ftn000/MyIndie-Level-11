<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Огонёк</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* игра горизонтальная: всегда 16:9, вписана в окно, остаток — чёрные полосы */
    #game { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; background: #000; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
               color: #ffd294; font: italic 22px/1.2 Georgia, serif; background: #000; transition: opacity .6s; }
    #bar { width: min(320px, 60vw); height: 4px; background: #2a1a10; border-radius: 2px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ff7a1a, #ffd294); transition: width .2s; }
    #error { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; color: #fff; background: #8b1a1a; font: 14px sans-serif; display: none; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <div id="loading"><div>Огонёк</div><div id="bar"><div id="fill"></div></div></div>
  <div id="error"></div>
  <script>
    var canvas = document.getElementById("game");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (msg, type) {
        if (type !== "error") return; // предупреждения движка игроку не показываем
        var e = document.getElementById("error"); e.textContent = msg; e.style.display = "block";
      },
    };
    // клик по игре возвращает фокус канвасу: иначе клавиатура уходит странице сайта
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        var l = document.getElementById("loading"); l.style.opacity = 0; setTimeout(function () { l.remove(); }, 700);
        canvas.focus();
      }).catch(function (m) { config.showBanner(m, "error"); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
